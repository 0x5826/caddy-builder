name: Build Caddy

on:
  schedule:
    - cron: "0 20 * * *"
  push:
    paths:
      - caddy-build-plugins.json
      - .github/workflows/build-caddy.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CADDY_REPO: caddyserver/caddy
  PLUGINS_FILE: caddy-build-plugins.json

jobs:
  check:
    name: Check upstream releases
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.versions.outputs.should_build }}
      release_tag: ${{ steps.versions.outputs.release_tag }}
      release_name: ${{ steps.versions.outputs.release_name }}
      caddy_version: ${{ steps.versions.outputs.caddy_version }}
      plugins_hash: ${{ steps.versions.outputs.plugins_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve latest upstream versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p metadata

          latest_release_or_tag() {
            repo="$1"
            name="$2"

            if gh release view --repo "${repo}" --json tagName,name,url,body > "metadata/${name}.json"; then
              jq -r '.tagName' "metadata/${name}.json"
              return
            fi

            gh api "repos/${repo}/tags?per_page=1" > "metadata/${name}-tags.json"
            tag="$(jq -r '.[0].name // empty' "metadata/${name}-tags.json")"
            if [ -z "$tag" ]; then
              echo "No release or tag found for ${repo}" >&2
              exit 1
            fi

            jq -n \
              --arg tag "$tag" \
              --arg repo "$repo" \
              '{
                tagName: $tag,
                name: $tag,
                url: ("https://github.com/" + $repo + "/releases/tag/" + $tag),
                body: "No GitHub Release was found for this component; using the latest tag instead."
              }' > "metadata/${name}.json"

            printf '%s\n' "$tag"
          }

          sanitize_tag_part() {
            printf '%s' "$1" | tr '/[:space:]' '-' | tr -cd 'A-Za-z0-9._-'
          }

          module_to_repo() {
            module="$1"
            case "$module" in
              github.com/*/*)
                printf '%s\n' "$module" | cut -d/ -f2-3
                ;;
              *)
                echo "Only github.com module paths are supported: ${module}" >&2
                exit 1
                ;;
            esac
          }

          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${PLUGINS_FILE}" >/dev/null; then
            echo "${PLUGINS_FILE} must be a non-empty JSON array of module path strings" >&2
            exit 1
          fi

          caddy_version="$(latest_release_or_tag "${CADDY_REPO}" caddy)"
          caddy_part="$(sanitize_tag_part "$caddy_version")"

          jq -r '.[]' "${PLUGINS_FILE}" > metadata/plugin_modules.txt
          : > metadata/plugin_versions.tsv
          : > metadata/xcaddy_with_args.txt

          while IFS= read -r module; do
            repo="$(module_to_repo "$module")"
            metadata_name="$(printf '%s' "$module" | tr '/[:space:]' '-' | tr -cd 'A-Za-z0-9._-')"
            version="$(latest_release_or_tag "$repo" "$metadata_name")"
            url="$(jq -r '.url' "metadata/${metadata_name}.json")"

            printf '%s\t%s\t%s\n' "$module" "$version" "$url" >> metadata/plugin_versions.tsv
            printf -- '--with %s@%s\n' "$module" "$version" >> metadata/xcaddy_with_args.txt
          done < metadata/plugin_modules.txt

          plugins_hash="$(sha256sum "${PLUGINS_FILE}" metadata/plugin_versions.tsv | sha256sum | cut -c1-12)"

          release_tag="caddy-${caddy_part}-plugins-${plugins_hash}"
          release_name="$(jq -r '.name // .tagName // empty' metadata/caddy.json)"
          if [ -z "$release_name" ] || [ "$release_name" = "null" ]; then
            release_name="$caddy_version"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            should_build=false
          else
            should_build=true
          fi

          {
            echo "# ${release_name}"
            echo
            echo "Built with:"
            echo
            echo "| Component | Version | Source |"
            echo "| --- | --- | --- |"
            echo "| Caddy | ${caddy_version} | $(jq -r '.url' metadata/caddy.json) |"
            awk -F '\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}' metadata/plugin_versions.tsv
            echo
            echo "## Caddy release notes"
            echo
            jq -r '.body // ""' metadata/caddy.json
          } > metadata/release_notes.md

          {
            echo "should_build=${should_build}"
            echo "release_tag=${release_tag}"
            echo "release_name=${release_name}"
            echo "caddy_version=${caddy_version}"
            echo "plugins_hash=${plugins_hash}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        if: steps.versions.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            metadata/release_notes.md
            metadata/xcaddy_with_args.txt
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: metadata

      - name: Build Caddy
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          CADDY_VERSION: ${{ needs.check.outputs.caddy_version }}
        run: |
          set -euo pipefail

          mkdir -p dist
          output="dist/caddy-${GOOS}-${GOARCH}"

          xcaddy build "${CADDY_VERSION}" \
            --output "${output}" \
            $(cat metadata/xcaddy_with_args.txt)

          if [ "${GOOS}/${GOARCH}" = "linux/amd64" ]; then
            "${output}" version
          else
            file "${output}"
          fi

      - name: Package artifact
        env:
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          tar -C dist -czf "dist/${RELEASE_TAG}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "caddy-${{ matrix.os }}-${{ matrix.arch }}"
          sha256sum "dist/${RELEASE_TAG}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" > "dist/${RELEASE_TAG}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - check
      - build
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: metadata

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: caddy-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.check.outputs.release_name }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_NAME}" \
            --notes-file metadata/release_notes.md
